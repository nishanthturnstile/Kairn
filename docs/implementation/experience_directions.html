<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:var(--font-sans);color:var(--foreground);line-height:1.5}button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--secondary);color:var(--foreground);cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.board{border-radius:var(--radius);overflow:hidden;background:#eef4f7;color:#173345}.scene{padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.scene h2{font:38px/1.1 Georgia,serif;margin:8px 0 20px}.swatches{display:flex;gap:8px}.swatches i{width:40px;height:40px;border-radius:50%;display:block}.specimen{padding:22px;border-radius:8px;background:#fff}.line{height:2px;background:currentColor;margin:24px 0}.caption{padding:20px;background:var(--card);color:var(--foreground)}.caption p{margin:6px 0}.mini{font-size:13px}.track{display:flex;justify-content:space-between;gap:8px;margin-top:28px}.track span{border-bottom:2px solid currentColor;padding-bottom:8px}@media(max-width:500px){.scene{grid-template-columns:1fr;padding:20px}.scene h2{font-size:32px}}
</style></head><body><nav aria-label="Creative directions"><button onclick="show(0)" aria-pressed="false">Travel album</button><button onclick="show(1)" aria-pressed="false">Expedition editorial</button><button onclick="show(2)" aria-pressed="true">Open atlas · selected</button></nav><div class="board" id="board"><div class="scene"><div><div class="swatches" id="swatches"></div><h2 id="title"></h2><p id="voice"></p><div class="track"><span>Depart</span><span>Explore</span><span>Pause</span><span>Return</span></div></div><div class="specimen" id="specimen"><p class="mini">Day 3 / Rest in town</p><h2>A day with nowhere to be.</h2><p>There is no track for this day. It belongs in the story all the same.</p><div class="line"></div><p class="mini">Reported by Dev · fictional sample</p></div></div><div class="caption"><p id="strength"></p><p id="risk"></p><p id="motion"></p></div></div><script>
const directions=[
{title:"The travel album",voice:"Limestone, ochre and intimate serif captions. Soft daylight photographs; generous, rounded album windows.",colors:["#eee8dc","#4b392b","#8a622c","#fffaf1"],strength:"Strength: personal warmth and memory.",risk:"Tradeoff: tactility can become decoration; dense editing needs more precision.",motion:"Motion: short page crossfades, no imitation paper physics."},
{title:"Expedition editorial",voice:"Documentary images, asymmetric spreads and decisive headlines. White, charcoal and restrained signal red.",colors:["#f7f7f5","#252525","#a22b30","#ffffff"],strength:"Strength: emotional arrival and photographic storytelling.",risk:"Tradeoff: dramatic layouts can compete with everyday creation tasks.",motion:"Motion: user-triggered cuts between chapters; no automatic film."},
{title:"The open atlas",voice:"Mineral white and deep blue. A calm chronological spine connects place, memory and practical detail.",colors:["#f3f6f8","#172d3b","#164d70","#ffffff"],strength:"Selected: clear geography and time, with an editorial reading layer.",risk:"Tradeoff: precision must leave room for personal voices and days without GPS.",motion:"Motion: brief state feedback; keep the selected chapter across views."}];
function show(i){const d=directions[i];document.querySelectorAll('button').forEach((b,n)=>b.setAttribute('aria-pressed',n===i));document.getElementById('board').style.background=d.colors[0];document.getElementById('board').style.color=d.colors[1];document.getElementById('specimen').style.background=d.colors[3];for(const k of ['title','voice','strength','risk','motion'])document.getElementById(k).textContent=d[k];document.getElementById('swatches').innerHTML=d.colors.map(c=>'<i style="background:'+c+'" title="'+c+'"></i>').join('')}show(2);
</script></body></html>
