name: kairn
services:
  edge:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    user: "1000:1000"
    ports:
      - "127.0.0.1:${KAIRN_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs: [/config, /data]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
  server:
    build:
      context: .
      dockerfile: infra/images/server.Dockerfile
      target: runtime
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${KAIRN_PUBLIC_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${KAIRN_LOG_LEVEL:-info}
      DATABASE_URL: ${KAIRN_SERVER_DATABASE_URL:-postgresql://kairn_server:kairn-server-local@postgres:5432/kairn}
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
  tooling:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/images/server.Dockerfile
      target: tooling
    init: true
    environment:
      TEST_BASE_URL: http://edge:8080
      TEST_PUBLIC_ORIGIN: ${KAIRN_PUBLIC_ORIGIN:-http://localhost:8080}
      TEST_DATABASE_URL: ${KAIRN_WORKER_DATABASE_URL:-postgresql://kairn_worker:kairn-worker-local@postgres:5432/kairn}
      TEST_MIGRATION_DATABASE_URL: ${KAIRN_MIGRATION_DATABASE_URL:-postgresql://kairn_migrator:kairn-migrator-local@postgres:5432/kairn}
      TEST_STORAGE_ENDPOINT: http://storage:8333
      TEST_STORAGE_ACCESS_KEY: ${KAIRN_STORAGE_ACCESS_KEY:-kairn-local}
      TEST_STORAGE_SECRET_KEY: ${KAIRN_STORAGE_SECRET_KEY:-kairn-storage-local-only}
    networks: [default, data]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: kairn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KAIRN_POSTGRES_PASSWORD:-kairn-postgres-local-only}
      KAIRN_MIGRATOR_PASSWORD: ${KAIRN_MIGRATOR_PASSWORD:-kairn-migrator-local}
      KAIRN_SERVER_DB_PASSWORD: ${KAIRN_SERVER_DB_PASSWORD:-kairn-server-local}
      KAIRN_WORKER_DB_PASSWORD: ${KAIRN_WORKER_DB_PASSWORD:-kairn-worker-local}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/initialize.sql:/docker-entrypoint-initdb.d/01-kairn.sql:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d kairn"]
      interval: 3s
      timeout: 3s
      retries: 20
    shm_size: 128m
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
  migrate:
    build:
      context: .
      dockerfile: infra/images/server.Dockerfile
      target: migrate
    init: true
    environment:
      MIGRATION_DATABASE_URL: ${KAIRN_MIGRATION_DATABASE_URL:-postgresql://kairn_migrator:kairn-migrator-local@postgres:5432/kairn}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 1
    pids_limit: 64
  worker:
    build:
      context: .
      dockerfile: infra/images/server.Dockerfile
      target: worker-runtime
    init: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${KAIRN_LOG_LEVEL:-info}
      DATABASE_URL: ${KAIRN_WORKER_DATABASE_URL:-postgresql://kairn_worker:kairn-worker-local@postgres:5432/kairn}
    networks: [default, data]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/kairn-worker-ready','utf8'))<15000?0:1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
  storage:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command:
      [
        mini,
        -dir=/data,
        -ip=storage,
        -ip.bind=0.0.0.0,
        -master.telemetry=false,
        -master.volumeSizeLimitMB=128,
        -volume.max=8,
        -webdav=false,
        -admin.ui=false,
        -admin.port.legacy=0,
        -s3.port.iceberg=0,
        -s3.port.lance=0,
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${KAIRN_STORAGE_ACCESS_KEY:-kairn-local}
      AWS_SECRET_ACCESS_KEY: ${KAIRN_STORAGE_SECRET_KEY:-kairn-storage-local-only}
      S3_BUCKET: kairn-private
    volumes: [storage-data:/data]
    networks: [data]
    healthcheck:
      test:
        [CMD-SHELL, "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403 Forbidden'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    cpus: 1
    pids_limit: 128

networks:
  data:
    internal: true
volumes:
  postgres-data:
  storage-data:
